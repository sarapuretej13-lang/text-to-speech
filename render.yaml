services:
  - type: web
    name: text-to-speech
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r ../requirements.txt"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FRONTEND_URL
        value: http://localhost:5173
    healthCheckPath: /api/health
